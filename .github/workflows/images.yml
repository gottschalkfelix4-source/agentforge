name: Images

# Builds and pushes the multi-arch images to GHCR:
#   ghcr.io/gottschalkfelix4-source/agentforge            (docker/app/Dockerfile)
#   ghcr.io/gottschalkfelix4-source/agentforge-workspace  (docker/workspace/Dockerfile)
#
# Tags: v1.2.3 → 1.2.3, 1.2, 1 · push to main → latest, main · always sha-<short>.
# Pull requests only build (amd64, no push) to catch Dockerfile breakage early.
#
# After the first run make both packages public (GitHub → Packages → <pkg> → Package settings →
# Change visibility), otherwise Unraid/compose cannot pull them without a login.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docker/**"
      - "packages/**"
      - "apps/*/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # arm64 is emulated (QEMU); the workspace image installs a lot of tooling, give it time.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agentforge
            dockerfile: docker/app/Dockerfile
            description: "Agentforge: self-hosted vibecoding platform (web UI + server)"
          - name: agentforge-workspace
            dockerfile: docker/workspace/Dockerfile
            description: "Agentforge workspace: dev toolchain, agent CLIs and the workspace daemon (wsd)"
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and version
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_REF_NAME//\//-}.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.vars.outputs.platforms }}
          push: ${{ steps.vars.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VIBE_VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
